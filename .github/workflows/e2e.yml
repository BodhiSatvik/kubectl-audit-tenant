name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6 # v6 builds with go.mod's toolchain directive
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: bin/e2e-*.out
