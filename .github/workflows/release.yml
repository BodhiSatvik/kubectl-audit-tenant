name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  KREW_VERSION: v0.5.0
  # sha256 of krew-<os>_<arch>.tar.gz for the runner platforms; the krew release's own .sha256 files and
  # GitHub's asset digests agreed on 2026-10-25. A new runner platform fails until its sum is added.
  KREW_SHA256_linux_amd64: 5d5a221fffdf331d1c5c68d9917530ecd102e0def5b5a6d62eeed1c404efb28a
  KREW_SHA256_darwin_arm64: cd6e58b4e954e301abd19001d772846997216d696bcaa58f0bcf04708339ece3
# The release stays a draft until krew installs its archives on both platforms; then publish makes it
# public and manifest-url installs from the published URL, which a draft does not serve.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # also fetches origin/main for the next step
          persist-credentials: false # tests run in this job; goreleaser reads GITHUB_TOKEN from env
      - name: Release only tags on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0; builds with go.mod's toolchain directive
        with:
          go-version-file: go.mod
      - run: go test ./... && make safety # never publish a binary whose read-only guarantee was not tested
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3 # pinned like every other tool; bump on purpose
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist # the same files the draft holds; krew-install reads them without a token that sees drafts
          path: |
            dist/*.tar.gz
            dist/krew/audit-tenant.yaml
          if-no-files-found: error
  krew-install:
    needs: goreleaser
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.37.1
      - name: Install krew, checked against its pinned sha256
        run: |
          set -euo pipefail
          os=$(uname | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          sum="KREW_SHA256_${os}_${arch}"
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/download/${KREW_VERSION}/krew-${os}_${arch}.tar.gz"
          echo "${!sum:?no pinned krew sha256 for ${os}_${arch}}  krew-${os}_${arch}.tar.gz" | shasum -a 256 -c -
          tar zxf "krew-${os}_${arch}.tar.gz"
          "./krew-${os}_${arch}" install krew
          echo "$HOME/.krew/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Install from the draft's manifest and archive in a clean KREW_ROOT
        run: |
          set -euo pipefail
          os=$(uname | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          export KREW_ROOT
          KREW_ROOT=$(mktemp -d)
          archive=$(ls dist/*_"${os}_${arch}".tar.gz) # a glob inside --archive=... never expands
          kubectl krew install --manifest=dist/krew/audit-tenant.yaml --archive="$archive"
          PATH="$KREW_ROOT/bin:$PATH" kubectl audit-tenant version | grep -F "${GITHUB_REF_NAME#v}"
  publish:
    needs: krew-install
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the draft
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
  manifest-url: # krew downloads with no token, so this needs a public repo; re-run it after the repo goes public
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.37.1
      - name: Install krew, checked against its pinned sha256
        run: |
          set -euo pipefail
          os=$(uname | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          sum="KREW_SHA256_${os}_${arch}"
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/download/${KREW_VERSION}/krew-${os}_${arch}.tar.gz"
          echo "${!sum:?no pinned krew sha256 for ${os}_${arch}}  krew-${os}_${arch}.tar.gz" | shasum -a 256 -c -
          tar zxf "krew-${os}_${arch}.tar.gz"
          "./krew-${os}_${arch}" install krew
          echo "$HOME/.krew/bin" >> "$GITHUB_PATH"
      - name: Install from the published manifest URL in a clean KREW_ROOT
        run: |
          set -euo pipefail
          export KREW_ROOT
          KREW_ROOT=$(mktemp -d)
          kubectl krew install --manifest-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/audit-tenant.yaml"
          PATH="$KREW_ROOT/bin:$PATH" kubectl audit-tenant version | grep -F "${GITHUB_REF_NAME#v}"
