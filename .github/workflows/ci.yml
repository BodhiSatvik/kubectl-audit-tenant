name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the floor guard diffs against origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - name: Install gitleaks and govulncheck
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: hack/check-public.sh --self-test && hack/check-public.sh
      - run: make check
      - run: make vuln
